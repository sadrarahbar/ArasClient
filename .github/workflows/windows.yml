name: Tesla VPN Windows
on:
  push:
    branches: [Windows-Client]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Download verified official Windows cores
        run: python windows/prepare_cores.py
      - name: Unit and native Windows API tests
        run: python -m unittest discover -s windows/tests -v
      - name: Build portable EXE
        run: python windows/build.py
      - name: Native core, Wintun and packaged GUI smoke tests
        run: python windows/smoke_test.py
      - name: Build setup installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'Inno Setup is missing from the Windows runner image.' }
          & $iscc windows/installer.iss
          if ($LASTEXITCODE) { throw 'Installer compilation failed.' }
          $setup = Get-Item artifacts/windows/*-Setup.exe
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          Add-Content artifacts/windows/SHA256SUMS "$hash  $($setup.Name)"
      - name: Install, launch and uninstall the setup package
        run: python windows/installer_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: TeslaVpn-Windows-x64
          path: |
            artifacts/windows/*.zip
            artifacts/windows/*-Setup.exe
            artifacts/windows/SHA256SUMS
            artifacts/windows/preview.png
          if-no-files-found: error
          retention-days: 14
